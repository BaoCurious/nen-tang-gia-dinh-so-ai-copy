<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --brand:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --brand:#60a5fa; --line:#374151; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header b { color:var(--brand); font-size:18px; } header span { flex:1; color:var(--muted); font-size:14px; }
  button, input { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button { cursor:pointer; } button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  #auth { max-width:360px; margin:60px auto; padding:24px; background:var(--card); border-radius:10px; display:grid; gap:10px; }
  #app { display:flex; min-height:calc(100vh - 56px); }
  nav { width:190px; padding:12px; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
  nav button { text-align:left; border:0; } nav button.active { background:var(--brand); color:#fff; }
  #view { flex:1; padding:20px; overflow-x:auto; }
  table { border-collapse:collapse; background:var(--card); width:100%; font-size:14px; }
  th, td { padding:8px 10px; border:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { background:var(--bg); } .msg { color:var(--muted); margin:8px 0; } .err { color:#dc2626; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><b>FamilyConnect</b><span id="who"></span><button id="logout" hidden>Đăng xuất</button></header>

<section id="auth">
  <h3 style="margin:0">Đăng nhập / Đăng ký</h3>
  <input id="full_name" placeholder="Họ tên (chỉ khi đăng ký)">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mật khẩu (≥ 8 ký tự)">
  <button class="primary" id="btnLogin">Đăng nhập</button>
  <button id="btnRegister">Đăng ký</button>
  <div id="authMsg" class="msg err"></div>
</section>

<section id="app" hidden>
  <nav id="nav"></nav>
  <div id="view"></div>
</section>

<script type="module">
// ---- API client: every response follows { success, status_code, message, data } ----
class ApiClient {
  constructor(base = '/api/v1') {
    this.base = base;
    this.token = sessionStorage.getItem('token');
  }
  setToken(token) {
    this.token = token;
    token ? sessionStorage.setItem('token', token) : sessionStorage.removeItem('token');
  }
  async request(path, { method = 'GET', body } = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (this.token) headers.Authorization = `Bearer ${this.token}`;
    const res = await fetch(this.base + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    return res.json();
  }
}

const RESOURCES = {
  'Dashboard': '/dashboard/stats', 'Gia đình': '/families', 'Nhánh họ': '/branches',
  'Thành viên': '/members', 'Quan hệ cha-con': '/relationships', 'Hôn nhân': '/marriages',
  'Bài đăng': '/posts', 'Bình luận': '/comments', 'Cảm xúc': '/reactions',
  'Sự kiện': '/events', 'Phản hồi (RSVP)': '/rsvps', 'Di sản số': '/heritages', 'Người dùng': '/users',
};

class App {
  constructor() {
    this.api = new ApiClient();
    this.$ = (id) => document.getElementById(id);
  }

  init() {
    this.$('btnLogin').onclick = () => this.submitAuth('login');
    this.$('btnRegister').onclick = () => this.submitAuth('register');
    this.$('logout').onclick = () => { this.api.setToken(null); this.render(); };
    this.buildNav();
    this.render();
  }

  render() {
    const loggedIn = !!this.api.token;
    this.$('auth').hidden = loggedIn;
    this.$('app').hidden = !loggedIn;
    this.$('logout').hidden = !loggedIn;
    this.$('who').textContent = '';
    if (loggedIn) this.load(Object.values(RESOURCES)[0]);
  }

  async submitAuth(mode) {
    const body = { email: this.$('email').value, password: this.$('password').value };
    if (mode === 'register') body.full_name = this.$('full_name').value;
    const r = await this.api.request(`/auth/${mode}`, { method: 'POST', body });
    this.$('authMsg').textContent = r.success ? '' : r.message;
    if (r.success) { this.api.setToken(r.data.access_token); this.$('who').textContent = r.data.user.full_name; this.render(); }
  }

  buildNav() {
    Object.entries(RESOURCES).forEach(([label, path]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => this.load(path, b);
      this.$('nav').appendChild(b);
    });
  }

  async load(path, btn) {
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('active', x === btn));
    const r = await this.api.request(path);
    const view = this.$('view');
    view.replaceChildren();
    if (r.status_code === 401) { this.api.setToken(null); return this.render(); }
    const note = document.createElement('div');
    note.className = 'msg' + (r.success ? '' : ' err');
    note.textContent = `${r.status_code} · ${r.message}`;
    view.appendChild(note);
    if (r.success && r.data) view.appendChild(this.table(r.data));
  }

  table(data) {
    const rows = Array.isArray(data) ? data : Object.entries(data).map(([key, value]) => ({ key, value }));
    const t = document.createElement('table');
    if (!rows.length) { t.innerHTML = '<tr><td>Chưa có dữ liệu</td></tr>'; return t; }
    const cols = Object.keys(rows[0]);
    const head = t.insertRow();
    cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; head.appendChild(th); });
    rows.forEach((row) => {
      const tr = t.insertRow();
      cols.forEach((c) => { tr.insertCell().textContent = row[c] ?? ''; });
    });
    return t;
  }
}

new App().init();
</script>
</body>
</html>
